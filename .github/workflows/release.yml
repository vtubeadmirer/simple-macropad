name: Windows build and release
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Codec tests
        run: node test-codec.cjs
      - name: Build
        shell: powershell
        run: ./build.ps1
      - name: Package
        shell: powershell
        run: |
          Copy-Item README.md dist
          Compress-Archive -Path dist/* -DestinationPath SimpleMacroPad-win-x64.zip
          $hash=(Get-FileHash SimpleMacroPad-win-x64.zip -Algorithm SHA256).Hash.ToLower()
          Set-Content SHA256SUMS.txt "$hash  SimpleMacroPad-win-x64.zip" -Encoding Ascii
      - uses: actions/upload-artifact@v4
        with:
          name: SimpleMacroPad-win-x64
          path: |
            SimpleMacroPad-win-x64.zip
            SHA256SUMS.txt
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME SimpleMacroPad-win-x64.zip SHA256SUMS.txt --verify-tag --title "Keypad $env:GITHUB_REF_NAME" --generate-notes
